  <!-- Cat Head -->
  <ellipse cx="32" cy="36" rx="20" ry="17" fill="#FFFFFF" />
  
  <!-- Ears -->
  <polygon points="15,28 12,12 26,22" fill="#FFFFFF" />
  <polygon points="16,25 14,15 24,22" fill="#FECACA" />
  
  <polygon points="49,28 52,12 38,22" fill="#FFFFFF" />
  <polygon points="48,25 50,15 40,22" fill="#FECACA" />
  
