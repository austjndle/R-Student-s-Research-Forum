  <ellipse cx="41" cy="32" rx="4" ry="4.5" fill="#0F172A" />
  
  <!-- Highlights -->
  <circle cx="21.5" cy="30.5" r="1.5" fill="#FFFFFF" />
  <circle cx="39.5" cy="30.5" r="1.5" fill="#FFFFFF" />
  <circle cx="24" cy="33.5" r="0.7" fill="#FFFFFF" />
  <circle cx="42" cy="33.5" r="0.7" fill="#FFFFFF" />
  
