  <line x1="9" y1="40" x2="18" y2="39" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="56" y1="36" x2="46" y2="37" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="55" y1="40" x2="46" y2="39" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" />
