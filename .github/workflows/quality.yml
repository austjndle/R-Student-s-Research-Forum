name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Dependency audit (moderate/high/critical blocking)
        # Low advisories remain visible for tracked review; moderate+ fail this job.
        run: bun audit --audit-level=moderate --json
      - name: Cloudflare/Vinext build
        run: bun run build:vinext
      - name: TypeScript check
        run: bun run check
      - name: Test suite
        run: bun run test --config vitest.config.ts
